name: Validate repository

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: pwsh
        run: |
          $required = @(
            "README.md",
            "INSTALLATION.md",
            "CONCLUSIONS.md",
            "CONTRIBUTING.md",
            "SECURITY.md",
            "CITATION.cff",
            "docs/PROJECT_MAP.md",
            "docs/LOCAL_VALIDATION.md",
            "examples/README.md",
            "codex-skills/video-start-end/SKILL.md",
            "codex-skills/webgl-right-video/SKILL.md",
            "cerveau-competence/competence-video-start-end-webgl/COMPETENCE.md"
          )
          foreach ($path in $required) {
            if (!(Test-Path $path)) {
              throw "Missing required file: $path"
            }
          }

      - name: Validate JSON files
        shell: pwsh
        run: |
          $jsonFiles = Get-ChildItem -Recurse -File -Include *.json
          foreach ($file in $jsonFiles) {
            try {
              Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json | Out-Null
            } catch {
              throw "Invalid JSON: $($file.FullName)"
            }
          }
